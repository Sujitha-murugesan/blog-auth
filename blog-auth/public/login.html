<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | BlogApp</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="login">
  <header id="navbar"></header>
  <main class="container">
    <div class="card form-card">
      <h1>Welcome back</h1>
      <p class="subtitle">Log in to manage your blogs.</p>
      <div class="notice" id="notice"></div>
      <form id="loginForm" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" required autocomplete="email" />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Your password" required autocomplete="current-password" />
        <label class="inline-check"><input type="checkbox" id="showPw" /> Show password</label>
        <div class="field-error" id="formError" role="alert"></div>
        <button class="btn btn-block" type="submit">Login</button>
      </form>
      <p class="form-footer">No account yet? <a href="register.html">Register</a></p>
    </div>
  </main>
  <footer id="footer"></footer>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
